[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kutu-doctor"
version = "0.1.0"
description = "kutu-doctor: live memory-health dashboard and control for kutu OS"
readme = "README.md"
license = "MIT"
authors = [{ name = "kutu OS contributors" }]
requires-python = ">=3.10"
keywords = ["kutu", "linux", "memory", "zswap", "mglru", "damon", "oomd"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
kutu-doctor = "kutu_doctor.cli:main"

[project.urls]
Homepage = "https://kutu.so"
Repository = "https://github.com/kutuso/doctor"
Documentation = "https://kutu.so/#/INSTALL.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kutu_doctor"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×", "≈", "·", "–", "—"]

[tool.ruff.lint.per-file-ignores]
"src/kutu_doctor/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
